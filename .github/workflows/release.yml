# Tags every publish with the site's CalVer version and keeps a GitHub Release
# for it, so GitHub's Tags and Releases match /about/release-history/.
#
# A push to main is a publish (Netlify builds it; this workflow doesn't touch
# that). The version is HEAD's commit date, the same as the navbar's. Several
# pushes on one day share a version, so the tag v<date> moves to the newest
# commit and that day's Release notes are rewritten from releases.ts.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Work out the version and notes
        id: version
        run: |
          VERSION=$(node scripts/release-notes.mjs --version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PKG=$(node -p 'require("./package.json").version')
          if [ "$PKG" != "$VERSION" ]; then
            echo "::warning::package.json version is $PKG but this publish is $VERSION (scripts/stamp-version.mjs sets it)"
          fi
          if ! node scripts/release-notes.mjs "$VERSION" > notes.md; then
            echo "::warning::No changelog entry for $VERSION in src/lib/data/releases.ts"
            printf 'Published %s. No changelog entry for this date yet; see [Release History](https://commonwaysystem.org/about/release-history/).\n' "$VERSION" > notes.md
          fi

      - name: Move the tag and update the Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$VERSION" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "$VERSION" --notes-file notes.md --latest --verify-tag
          fi
