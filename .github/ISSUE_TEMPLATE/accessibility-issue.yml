name: Accessibility issue
description: Anything that makes the site harder to use with a screen reader, keyboard navigation, or at different zoom levels.
title: "[Accessibility]: "
labels: ["accessibility"]
body:
  - type: input
    id: page
    attributes:
      label: Page URL
      description: The commonwaysystem.org page this is on, or "site-wide" if it isn't page-specific.
      placeholder: https://commonwaysystem.org/guide/local-streets/bicycle-boulevard/
    validations:
      required: true
  - type: textarea
    id: what-is-wrong
    attributes:
      label: What's happening, and what did you expect instead
    validations:
      required: true
  - type: input
    id: assistive-tech
    attributes:
      label: Assistive technology, browser, and zoom level, if relevant
      placeholder: VoiceOver + Safari, 200% zoom
    validations:
      required: false
