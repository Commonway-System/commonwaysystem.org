name: Missing citation / unsourced claim
description: Something that should carry the unsourced-claim flag but doesn't, or a flagged claim you believe now has a source available.
title: "[Citation]: "
labels: ["citation"]
body:
  - type: input
    id: page
    attributes:
      label: Page URL
      description: The commonwaysystem.org page this is on.
      placeholder: https://commonwaysystem.org/patterns/local-streets/bicycle-boulevard/
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: The claim
      description: Quote the sentence that needs a citation, or that's currently flagged and shouldn't be (or vice versa).
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source, if you have one
      description: A link to a statute, adopted code, or manual (legal/regulatory); a study or crash-data report (evidence-based); or a real place doing it (precedent-based). Evidence tier matters, see the Governance page.
    validations:
      required: false
  - type: dropdown
    id: safety-relevant
    attributes:
      label: Could this lead someone to make an unsafe real-world design decision?
      description: Safety-relevant reports are looked at first.
      options:
        - "No"
        - "Yes"
    validations:
      required: true
