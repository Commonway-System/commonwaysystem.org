<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fdfaf3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicons/dark-favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="Commonway System Blog" href="/rss.xml" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <script>
      // Apply saved display settings before first paint (mirror of
      // src/lib/theme/display-settings.ts's apply()); no flash of default text size.
      try {
        var s = JSON.parse(localStorage.getItem('commonway-display-settings') || '{}') || {}
        var r = document.documentElement
        r.dataset.textSize = s.textSize || 'default'
        r.dataset.contrast = s.contrast || (window.matchMedia('(prefers-contrast: more)').matches ? 'high' : 'default')
        r.dataset.font = s.readingFont || 'default'
        r.dataset.symbols = s.colorSymbols ? 'on' : 'off'
        r.dataset.view = s.simplifiedView ? 'simple' : 'default'
        r.dataset.focus = s.enhancedFocus ? 'enhanced' : 'default'
        r.dataset.pointer = s.largePointer ? 'large' : 'default'
        r.dataset.halo = s.pointerHalo ? 'on' : 'off'
      } catch (e) {}
    </script>
    <!-- Speculation Rules: prefetch same-site pages on hover/pointer-down intent.
         Markdown copies, text-only pages and the search index are left out. -->
    <script type="speculationrules">
      {"prefetch":[{"where":{"and":[{"href_matches":"/*"},{"not":{"href_matches":"/*.md"}},{"not":{"href_matches":"/text/*"}},{"not":{"href_matches":"/pagefind/*"}}]},"eagerness":"moderate"}]}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
